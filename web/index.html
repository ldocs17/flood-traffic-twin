<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flood-Traffic Twin — Run Replay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #14141f;
    color: #e6e6ec;
  }
  #app { display: flex; height: 100%; }
  #map { flex: 1 1 auto; min-width: 0; }
  #sidebar {
    width: 320px; flex: 0 0 320px; overflow-y: auto;
    background: #1a1a2e; border-right: 1px solid #333;
    padding: 16px; box-sizing: border-box;
  }
  #sidebar h1 { font-size: 16px; margin: 0 0 4px; }
  #sidebar .subtitle { font-size: 11px; color: #999; margin-bottom: 16px; }
  #sidebar label { display: block; font-size: 12px; color: #aaa; margin: 14px 0 4px; }
  #sidebar select, #sidebar input[type=range] { width: 100%; box-sizing: border-box; }
  select {
    background: #2a2a40; color: #e6e6ec; border: 1px solid #444;
    border-radius: 4px; padding: 6px; font-size: 13px;
  }
  #runInfo { font-size: 12px; line-height: 1.6; margin-top: 10px; }
  #runInfo .row { display: flex; justify-content: space-between; }
  #runInfo .row span:first-child { color: #999; }
  #runInfo .warn { color: #f39c12; }
  #runInfo .bad { color: #e74c3c; }
  #runInfo .ok { color: #2ecc71; }
  .legend { font-size: 12px; margin-top: 16px; }
  .legend .item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 14px; }
  #status { font-size: 11px; color: #777; margin-top: 20px; white-space: pre-wrap; }
  #controls {
    position: absolute; left: 336px; right: 12px; bottom: 12px;
    background: rgba(20,20,31,0.92); border: 1px solid #333; border-radius: 8px;
    padding: 10px 16px; display: flex; align-items: center; gap: 12px;
    font-size: 12px; z-index: 5;
  }
  #playBtn {
    background: #2ecc71; color: #111; border: none; border-radius: 50%;
    width: 32px; height: 32px; font-size: 14px; cursor: pointer; flex: 0 0 32px;
  }
  #timeSlider { flex: 1 1 auto; }
  #timeLabel { width: 150px; text-align: right; flex: 0 0 150px; font-variant-numeric: tabular-nums; }
  #speedSelect { flex: 0 0 auto; }
  .loading { padding: 40px; text-align: center; color: #888; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Flood-Traffic Digital Twin</h1>
    <div class="subtitle">Slice 5 — replay of a completed run</div>

    <label for="runSelect">Run</label>
    <select id="runSelect"><option>Loading runs...</option></select>

    <div id="runInfo"></div>

    <label for="opacitySlider">Flood raster opacity (<span id="opacityVal">70%</span>)</label>
    <input id="opacitySlider" type="range" min="0" max="100" value="70">

    <div class="legend">
      <b>Edges</b>
      <div class="item"><div class="swatch" style="background:#2ecc71"></div>open</div>
      <div class="item"><div class="swatch" style="background:#f39c12"></div>slowed</div>
      <div class="item"><div class="swatch" style="background:#e74c3c"></div>closed</div>
      <b style="display:block; margin-top:10px;">Flood depth</b>
      <div class="item"><div class="swatch" style="background:rgba(30,150,255,0.5)"></div>shallow</div>
      <div class="item"><div class="swatch" style="background:rgba(0,60,220,0.85)"></div>deep</div>
      <b style="display:block; margin-top:10px;">Vehicles</b>
      <div class="item"><div class="swatch" style="background:#00b7ff; border-radius:50%"></div>moving</div>
    </div>

    <div id="status"></div>
  </div>
  <div id="map"></div>
  <div id="controls">
    <button id="playBtn" title="Play/Pause">&#9654;</button>
    <input id="timeSlider" type="range" min="0" max="3700" value="0" step="1">
    <div id="timeLabel">t = 0s</div>
    <select id="speedSelect">
      <option value="1">1x</option>
      <option value="4" selected>4x</option>
      <option value="16">16x</option>
      <option value="60">60x</option>
    </select>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
